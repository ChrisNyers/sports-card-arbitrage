[project]
name = "sports-card-arbitrage"
version = "0.1.0"
description = "Phase 1 MVP: sports card arbitrage opportunity scanner and position tracker"
requires-python = ">=3.10"

[project.scripts]
cardarb = "cardarb.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cardarb*"]
